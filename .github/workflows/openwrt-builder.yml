name: OpenWrt Builder

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      enable_plugins:                # 👈 新增：云编译时可勾选的插件/主题开关
        description: '安装 plugin.txt 中的插件和主题'
        required: false
        default: false
        type: boolean
      enable_docker_kernel:          # 👈 修改：拆分为 Docker 内核支持
        description: '启用 Docker 内核支持 (Cgroups/IPvlan等)'
        required: false
        default: false
        type: boolean
      enable_docker_apps:            # 👈 修改：拆分为 Docker 用户态软件
        description: '启用 Docker 用户态软件 (dockerd等)'
        required: false
        default: false
        type: boolean
      enable_usb_storage:            # 👈 新增：云编译时可勾选的 U盘驱动/Samba4 开关（默认启用）
        description: '启用U盘驱动与Samba4支持'
        required: false
        default: true
        type: boolean

env:
  REPO_URL: https://github.com/pbs05/ponwrt.git
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: configs/an7581.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  # 👈 修改：移除硬编码的 FIRMWARE_PREFIX，改为在后续步骤中动态生成
  PLUGINS_ENABLED: ${{ github.event.inputs.enable_plugins || 'false' }}   # 👈 新增：导出开关为环境变量
  DOCKER_KERNEL_ENABLED: ${{ github.event.inputs.enable_docker_kernel || 'false' }}   # 👈 修改：Docker 内核开关
  DOCKER_APPS_ENABLED: ${{ github.event.inputs.enable_docker_apps || 'false' }}       # 👈 修改：Docker 应用开关
  USB_STORAGE_ENABLED: ${{ github.event.inputs.enable_usb_storage || 'true' }}   # 👈 新增：U盘/Samba4 开关，默认启用
  KEEP_WORKFLOW_RUNS: 10         # 👈 新增：保留 Actions 运行记录的数量
  KEEP_RELEASES: 10              # 👈 新增：保留 Releases 版本的数量
  KEEP_DAYS: 20                  # 👈 新增：保留天数的统一参数 (替代原 retain_days)

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:  # 👈 新增这一行
      actions: write      # 👈 新增这一行，允许删除旧 workflow run 记录（解决这个报错的关键）
      contents: write        # 👈 新增这一行，允许创建 Release、上传固件

    steps:
    - name: Checkout
      uses: actions/checkout@main
      with:
        fetch-depth: 0      # 拉取完整提交历史，供 autocore 按提交时间比较使用

    # 👈 新增：在编译前生成并推送“编制说明.txt”到仓库，这样 GitHub 自动打包的 Source code 就会包含它
    - name: Generate and Commit 编制说明.txt
      run: |
        cat > 编制说明.txt << EOF
        固件编译说明
        ================================
        编译时间: $(date +"%Y-%m-%d %H:%M:%S")

        编译选项:
        - 安装插件与主题: $([ "${PLUGINS_ENABLED:-false}" = "true" ] && echo "✅ 已勾选" || echo "❌ 未勾选")
        - Docker 内核支持: $([ "${DOCKER_KERNEL_ENABLED:-false}" = "true" ] && echo "✅ 已勾选" || echo "❌ 未勾选")
        - Docker 用户态软件: $([ "${DOCKER_APPS_ENABLED:-false}" = "true" ] && echo "✅ 已勾选" || echo "❌ 未勾选")
        - U盘驱动与Samba4支持: $([ "${USB_STORAGE_ENABLED:-true}" = "true" ] && echo "✅ 已勾选" || echo "❌ 未勾选")
        EOF
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add 编制说明.txt
        git commit -m "Auto-update 编制说明.txt [skip ci]" || true
        git push origin HEAD:${{ github.ref_name }} || true

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH ponwrt
        ln -sf /workdir/ponwrt $GITHUB_WORKSPACE/ponwrt
        cd ponwrt && git config --global --add safe.directory /workdir/ponwrt #我的代码

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF ponwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd ponwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: |
        cd ponwrt
        sed -i '/helloworld/d' feeds.conf.default
        ./scripts/feeds clean
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files ponwrt/files
        # 👈 新增：将根目录的 plugin.txt 移入工作区，供 diy-part2.sh 读取
        [ -e plugin.txt ] && cp plugin.txt ponwrt/plugin.txt
        cp ponwrt/$CONFIG_FILE ponwrt/.config
        chmod +x $DIY_P2_SH
        cd ponwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

        # 👈 修改：动态拼接固件前缀，根据 Docker 选项详细区分
        PREFIX="PonWrt_EN758X-ubi"
        if [ "${DOCKER_KERNEL_ENABLED:-false}" = "true" ] && [ "${DOCKER_APPS_ENABLED:-false}" = "true" ]; then
          PREFIX="${PREFIX}_docker"
        elif [ "${DOCKER_KERNEL_ENABLED:-false}" = "true" ]; then
          PREFIX="${PREFIX}_docker_kmod"
        elif [ "${DOCKER_APPS_ENABLED:-false}" = "true" ]; then
          PREFIX="${PREFIX}_docker_apps"
        fi
        echo "FIRMWARE_PREFIX=${PREFIX}" >> $GITHUB_ENV

    - name: Download package
      id: package
      run: |
        cd ponwrt
        make defconfig
        #make download -j8 #原始
        make download -j$(nproc) #我的代码方案二
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd ponwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s   #原始
        #make -j$(nproc) || make -j1 V=s #我修改的方案二
        #make -j1 V=s  #我修改的方案一
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(paste -sd '_' DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        # Artifact 名称改为固定前缀 + 时间戳（与 firmware 命名风格一致）
        name: PonWrt_bin${{ env.FILE_DATE }}
        path: ponwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        # 使用固定的绝对路径作为扁平化目录，避免 cd 导致的相对路径问题
        RELEASE_DIR="/tmp/firmware-release"
        mkdir -p "$RELEASE_DIR"

        # 递归查找所有 .itb / .bin / .manifest / .buildinfo 文件并复制到扁平目录
        # 说明：ponwrt 的 UBI 固件扩展名是 .itb（不是 .bin），必须同时匹配
        find /workdir/ponwrt/bin/targets -type f \( -name "*.itb" -o -name "*.bin" -o -name "*.manifest" -o -name "*.buildinfo" \) -exec cp {} "$RELEASE_DIR/" \;

        # 列出收集到的文件，方便排查
        echo "=== Files collected for release ==="
        ls -lh "$RELEASE_DIR/"

        # 如果没有任何文件被收集到，直接让这一步失败，避免后面带着空路径去上传
        if [ -z "$(ls -A "$RELEASE_DIR")" ]; then
          echo "错误：没有收集到任何固件文件，请检查编译是否成功。"
          exit 1
        fi

        echo "FIRMWARE=$RELEASE_DIR" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        # Artifact 名称改为固定前缀 PonWrt_EN758X-ubi (+ 后缀) + 时间戳
        name: ${{ env.FIRMWARE_PREFIX }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        # 👈 修改：将编译选项同步写入 release 描述里
        echo "## 编译选项" > release.txt
        echo "- **插件与主题**: $([ "${PLUGINS_ENABLED:-false}" = "true" ] && echo "✅ 已勾选" || echo "❌ 未勾选")" >> release.txt
        echo "- **Docker 内核支持**: $([ "${DOCKER_KERNEL_ENABLED:-false}" = "true" ] && echo "✅ 已勾选" || echo "❌ 未勾选")" >> release.txt
        echo "- **Docker 用户态软件**: $([ "${DOCKER_APPS_ENABLED:-false}" = "true" ] && echo "✅ 已勾选" || echo "❌ 未勾选")" >> release.txt
        echo "- **U盘驱动与Samba4**: $([ "${USB_STORAGE_ENABLED:-true}" = "true" ] && echo "✅ 已勾选" || echo "❌ 未勾选")" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2   # 保留 v2，之前一直可用
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        # 直接用固定路径，避免 env.FIRMWARE 意外为空时把 /* 展开到根目录
        files: /tmp/firmware-release/*

    # 👈 修改：完全替代 Mattraks，用 gh 原生实现"保留天数+数量"双重条件的强制清理
    - name: Cleanup Workflow Runs
      if: always()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "=== 正在清理 Actions 运行记录 (保留最新 ${{ env.KEEP_WORKFLOW_RUNS }} 个且 ${{ env.KEEP_DAYS }} 天内) ==="
        CUTOFF_ISO=$(date -u -d "${{ env.KEEP_DAYS }} days ago" +%Y-%m-%dT%H:%M:%SZ)
        # 获取列表，倒序排，跳过前 N 个（保护最新的），在剩下的里面只挑出早于设定天数的进行删除
        gh run list --limit 100 --json databaseId,createdAt --jq "
          (sort_by(.createdAt) | reverse) as \$sorted |
          \$sorted[ ${{ env.KEEP_WORKFLOW_RUNS }}: ] | 
          map(select(.createdAt < \"$CUTOFF_ISO\")) | 
          .[].databaseId
        " | while read -r id; do
          if [ -n "$id" ]; then
            echo "强制删除运行记录: $id"
            gh run delete "$id" || true
          fi
        done

    # 👈 修改：增加"保留天数"逻辑，同时清理草稿和旧版本
    - name: Cleanup old Releases and Drafts
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # 1. 彻底清理所有草稿 (Drafts)
        echo "=== 正在清理所有草稿 ==="
        gh release list --draft --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
          if [ -n "$tag" ]; then
            echo "删除草稿: $tag"
            gh release delete "$tag" --yes --cleanup-tag || true
          fi
        done

        # 2. 清理旧版本 (保留最新 N 个且 M 天内)
        echo "=== 正在清理旧版本 (保留最新 ${{ env.KEEP_RELEASES }} 个且 ${{ env.KEEP_DAYS }} 天内) ==="
        CUTOFF_ISO=$(date -u -d "${{ env.KEEP_DAYS }} days ago" +%Y-%m-%dT%H:%M:%SZ)
        gh release list --exclude-drafts --limit 100 --json tagName,createdAt --jq "
          (sort_by(.createdAt) | reverse) as \$sorted |
          \$sorted[ ${{ env.KEEP_RELEASES }}: ] | 
          map(select(.createdAt < \"$CUTOFF_ISO\")) | 
          .[].tagName
        " | while read -r tag; do
          if [ -n "$tag" ]; then
            echo "删除旧版本: $tag"
            gh release delete "$tag" --yes --cleanup-tag || true
          fi
        done
